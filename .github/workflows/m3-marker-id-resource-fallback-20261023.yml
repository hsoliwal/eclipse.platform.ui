# SPDX-License-Identifier: Apache-2.0
name: Eclipse M3 marker ID/resource source-backed identity guard
on:
  pull_request:
    paths:
      - 'bundles/org.eclipse.ui.ide/src/org/eclipse/ui/internal/views/markers/M3MarkerLanes.java'
      - 'bundles/org.eclipse.ui.ide/src/org/eclipse/ui/internal/views/markers/M3MarkerDeltas.java'
      - 'docs/m3/marker-id-resource-fallback-20261023/**'
      - '.github/workflows/m3-marker-id-resource-fallback-20261023.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-backed-java21:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile the original extracted identity implementation and exercise eight collision cases
        run: bash docs/m3/marker-id-resource-fallback-20261023/verify-identity.sh
