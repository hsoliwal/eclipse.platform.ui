---
type: specs.openrewrite.org/v1beta/recipe
name: com.synexia.openrewrite.viewport.MarkersViewDeltaHooks
displayName: Markers view on one lane model and marker deltas (M3)
description: >-
  Hooks of the markers views' lane model and delta path (docs/m3/markers-view/DESIGN.md, PROBLEMS_VIEW.md): the
  change listener offers the IMarkerDeltas to M3MarkerDeltas before scheduling a clean rebuild; a clean rebuild
  supersedes pending deltas and builds M3MarkerLanes instead of the entry array; Markers answers categories, counts,
  marker items, clones and resorts from the lanes; the total count, the content provider's windows and hasChildren
  come from the lanes; the tree viewer exposes preservingSelection for the window patch. Every hook is inert unless
  -Dorg.eclipse.ui.ide.markers.mode=viewport.
recipeList:
  - com.synexia.openrewrite.viewport.M3InsertStatements:
      declaringClasses: [org.eclipse.ui.internal.views.markers.MarkersChangeListener]
      methodName: resourceChanged
      anchor: "builder.getUpdateScheduler().scheduleUpdate();"
      position: BEFORE
      statements: "\t\t\tif (M3MarkerDeltas.offer(this, event, listeningTypes)) {\n\t\t\t\treturn;\n\t\t\t}"
  - com.synexia.openrewrite.viewport.M3InsertStatements:
      declaringClasses: [org.eclipse.ui.internal.views.markers.CachedMarkerBuilder]
      methodName: scheduleUpdateJob
      parameterCount: 3
      position: METHOD_START
      statements: "\t\tM3MarkerDeltas.supersede(this);"
  - com.synexia.openrewrite.viewport.M3InsertStatements:
      declaringClasses: [org.eclipse.ui.internal.views.markers.CachedMarkerBuilder]
      methodName: getTotalMarkerCount
      parameterCount: 1
      position: METHOD_START
      statements: "\t\tM3MarkerLanes lanes = markers.m3;\n\t\tif (lanes != null) {\n\t\t\treturn lanes.size();\n\t\t}"
  - com.synexia.openrewrite.viewport.M3AddMemberIfMissing:
      declaringClasses: [org.eclipse.ui.internal.views.markers.Markers]
      memberName: m3
      beforeMethod: updateWithNewMarkers
      memberSource: "\t/**\n\t * The lane model in M3 mode (M3MarkerLanes, docs/m3/markers-view/PROBLEMS_VIEW.md); {@code null} while\n\t * the entry array is the model.\n\t */\n\tvolatile M3MarkerLanes m3;\n"
  - com.synexia.openrewrite.viewport.M3InsertStatements:
      declaringClasses: [org.eclipse.ui.internal.views.markers.Markers]
      methodName: updateWithNewMarkers
      anchor: "if (markerEntries.isEmpty())"
      position: BEFORE
      statements: "\t\t\tif (M3MarkerDeltas.ENABLED) {\n\t\t\t\tm3 = sortAndGroup ? M3MarkerDeltas.build(this, markerEntries, monitor) : null;\n\t\t\t\tif (m3 != null) {\n\t\t\t\t\tcategories = m3.categories();\n\t\t\t\t\tmarkerEntryArray = EMPTY_ENTRY_ARRAY;\n\t\t\t\t\tmarkerCounts = m3.counts();\n\t\t\t\t\treturn !monitor.isCanceled();\n\t\t\t\t}\n\t\t\t}"
  - com.synexia.openrewrite.viewport.M3InsertStatements:
      declaringClasses: [org.eclipse.ui.internal.views.markers.Markers]
      methodName: sortMarkerEntries
      position: METHOD_START
      statements: "\t\tM3MarkerLanes lanes = m3;\n\t\tif (lanes != null) {\n\t\t\tif (lanes.resort(builder.getComparator())) {\n\t\t\t\treturn true;\n\t\t\t}\n\t\t\tm3 = null;\n\t\t\tbuilder.scheduleUpdate();\n\t\t\treturn false;\n\t\t}"
  - com.synexia.openrewrite.viewport.M3InsertStatements:
      declaringClasses: [org.eclipse.ui.internal.views.markers.Markers]
      methodName: getMarkerCounts
      parameterCount: 0
      position: METHOD_START
      statements: "\t\tM3MarkerLanes lanes = m3;\n\t\tif (lanes != null) {\n\t\t\treturn lanes.counts();\n\t\t}"
  - com.synexia.openrewrite.viewport.M3InsertStatements:
      declaringClasses: [org.eclipse.ui.internal.views.markers.Markers]
      methodName: getMarkerItem
      position: METHOD_START
      statements: "\t\tM3MarkerLanes lanes = m3;\n\t\tif (lanes != null) {\n\t\t\treturn lanes.item(marker);\n\t\t}"
  - com.synexia.openrewrite.viewport.M3InsertStatements:
      declaringClasses: [org.eclipse.ui.internal.views.markers.Markers]
      methodName: getCategories
      position: METHOD_START
      statements: "\t\tM3MarkerLanes lanes = m3;\n\t\tif (lanes != null) {\n\t\t\treturn lanes.categories();\n\t\t}"
  - com.synexia.openrewrite.viewport.M3InsertStatements:
      declaringClasses: [org.eclipse.ui.internal.views.markers.Markers]
      methodName: getElements
      position: METHOD_START
      statements: "\t\tM3MarkerLanes lanes = m3;\n\t\tif (lanes != null) {\n\t\t\treturn lanes.categories();\n\t\t}"
  - com.synexia.openrewrite.viewport.M3InsertStatements:
