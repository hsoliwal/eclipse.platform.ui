      methodName: getChildren
      position: METHOD_START
      statements: "\t\tif (parentElement instanceof M3MarkerCategory category && markersView.getSearchFilter() == null) {\n\t\t\treturn category.window(M3MarkerDeltas.limit(markersView));\n\t\t}"
